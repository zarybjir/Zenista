<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#04110c">
<title>Radar</title>
<style>
  :root {
    --bg: #04110c;
    --fg: #d9ffe9;
    --dim: #7fb89a;
    --accent: #3dff9a;
    --alert: #ffd23d;
    --panel: rgba(4, 17, 12, .72);
    --mono: ui-monospace, "SF Mono", "Roboto Mono", Menlo, Consolas, monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg);
    font-family: var(--mono); overflow: hidden; -webkit-user-select: none; user-select: none; }
  [hidden] { display: none !important; }

  #stage { position: fixed; inset: 0; }
  #video, #overlay { position: absolute; inset: 0; width: 100%; height: 100%; }
  #video { object-fit: cover; }
  #video.mirror { transform: scaleX(-1); }

  .hud { position: absolute; left: 0; right: 0; display: flex; align-items: center;
    justify-content: space-between; gap: 12px; pointer-events: none;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .hud.top { top: 0; padding-top: calc(env(safe-area-inset-top, 0px) + 12px); }
  .hud.bottom { bottom: 0; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); }
  .chip { background: var(--panel); border: 1px solid rgba(61, 255, 154, .35);
    border-radius: 4px; padding: 6px 10px; font-size: 12px; letter-spacing: .12em;
    text-transform: uppercase; }
  .chip b { color: var(--accent); font-weight: 700; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent); margin-right: 6px; animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity: .25; } }

  button { font: inherit; color: var(--fg); background: var(--panel);
    border: 1px solid var(--accent); border-radius: 4px; padding: 12px 16px;
    letter-spacing: .1em; text-transform: uppercase; font-size: 13px;
    pointer-events: auto; cursor: pointer; }
  button:active { background: rgba(61, 255, 154, .25); }
  button:focus-visible { outline: 2px solid var(--alert); outline-offset: 2px; }

  #intro { position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 20px; text-align: center;
    padding: 24px max(24px, env(safe-area-inset-right, 0px)) 24px max(24px, env(safe-area-inset-left, 0px));
    background:
      radial-gradient(circle at 50% 42%, rgba(61, 255, 154, .14), transparent 55%),
      repeating-radial-gradient(circle at 50% 42%, transparent 0 38px, rgba(61, 255, 154, .12) 38px 39px),
      var(--bg); }
  #intro h1 { margin: 0; font-size: clamp(34px, 11vw, 64px); letter-spacing: .2em;
    color: var(--accent); text-indent: .2em; }
  #intro p { margin: 0; max-width: 34ch; color: var(--dim); font-size: 14px; line-height: 1.5; }
  #intro button { font-size: 16px; padding: 16px 28px; background: var(--accent);
    color: var(--bg); font-weight: 700; }
  .field { display: flex; flex-direction: column; gap: 8px; width: min(100%, 320px);
    color: var(--dim); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
  .field input { font: inherit; font-size: 16px; color: var(--fg); background: var(--panel);
    border: 1px solid rgba(61, 255, 154, .5); border-radius: 4px; padding: 12px;
    text-align: center; text-transform: none; letter-spacing: 0;
    -webkit-user-select: text; user-select: text; }
  .field input:focus-visible { outline: 2px solid var(--alert); outline-offset: 2px; }
  #msg { color: var(--alert); min-height: 1.5em; }

  @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
</style>
</head>
<body>

<div id="stage" hidden>
  <video id="video" playsinline muted autoplay></video>
  <canvas id="overlay"></canvas>
  <div class="hud top">
    <div class="chip"><span class="dot"></span>Radar aktivní</div>
    <div class="chip">Cíle: <b id="count">0</b></div>
  </div>
  <div class="hud bottom">
    <button id="flip" type="button">Otočit kameru</button>
    <button id="shuffle" type="button">Nové nálepky</button>
  </div>
</div>

<div id="intro">
  <h1>RADAR</h1>
  <p>Kamera vyhledá obličeje v záběru a každému přidělí náhodnou nálepku. Obraz zůstává v telefonu, nikam se neodesílá.</p>
  <label class="field" for="custom">Vlastní text nálepky (nepovinné)
    <input id="custom" type="text" maxlength="40" autocomplete="off" placeholder="Prázdné = náhodné nálepky">
  </label>
  <button id="start" type="button">Spustit</button>
  <p id="msg" role="status"></p>
</div>

<script type="module">
// MediaPipe Tasks Vision 0.10.14, bundled with the page so it works offline.
const MP = new URL("./mp", location.href).href;
const MODEL = MP + "/face.tflite";

const LABELS = [
  "ŠÉF", "LEGENDA", "AGENT 007", "VIP", "GÉNIUS", "MISTR KÁVY",
  "KRÁL KANCELÁŘE", "100% KOLEGA", "EXPERT NA TABULKY", "PODEZŘELE DOBRÁ NÁLADA",
  "HLEDANÝ ZA DOBRÝ VTIP", "PŘESTÁVKA NUTNÁ", "ZAMĚSTNANEC MĚSÍCE", "TAJNÝ ZÁKAZNÍK",
  "MAJITEL POSLEDNÍHO ROHLÍKU", "ČEKÁ NA PÁTEK"
];

const $ = id => document.getElementById(id);
const video = $("video"), canvas = $("overlay"), ctx = canvas.getContext("2d");
const msg = $("msg");

let detector = null, stream = null, facing = "environment";
let tracks = [], nextId = 1, running = false;

async function loadDetector() {
  if (detector) return;
  const { FaceDetector, FilesetResolver } = await import(MP + "/vision_bundle.js");
  const files = await FilesetResolver.forVisionTasks(MP + "/wasm");
  const make = delegate => FaceDetector.createFromOptions(files, {
    baseOptions: { modelAssetPath: MODEL, delegate },
    runningMode: "VIDEO", minDetectionConfidence: 0.5
  });
  try { detector = await make("GPU"); } catch { detector = await make("CPU"); }
}

async function openCamera() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = await navigator.mediaDevices.getUserMedia({
    audio: false,
    video: { facingMode: facing, width: { ideal: 1280 }, height: { ideal: 720 } }
  });
  video.srcObject = stream;
  await video.play();
  const actual = stream.getVideoTracks()[0].getSettings().facingMode;
  video.classList.toggle("mirror", (actual || facing) === "user");
  tracks = [];
}

let customText = "";
const customInput = $("custom");
try { customInput.value = localStorage.getItem("radarText") || ""; } catch {}

function pickLabel() {
  if (customText) return customText;
  const used = new Set(tracks.map(t => t.label));
  const free = LABELS.filter(l => !used.has(l));
  const pool = free.length ? free : LABELS;
  return pool[Math.floor(Math.random() * pool.length)];
}

// Keeps a label attached to the same face between frames.
function updateTracks(boxes, now) {
  const free = new Set(tracks);
  for (const b of boxes) {
    let best = null, bestD = Infinity;
    for (const t of free) {
      const d = Math.hypot(t.cx - b.cx, t.cy - b.cy);
      if (d < bestD) { best = t; bestD = d; }
    }
    if (best && bestD < Math.max(b.w, best.w)) {
      free.delete(best);
      const k = 0.5; // smoothing
      best.cx += (b.cx - best.cx) * k; best.cy += (b.cy - best.cy) * k;
      best.w += (b.w - best.w) * k; best.h += (b.h - best.h) * k;
      best.seen = now;
    } else {
      tracks.push({ id: nextId++, ...b, label: pickLabel(), seen: now, born: now });
    }
  }
  tracks = tracks.filter(t => now - t.seen < 700);
}

function draw(now) {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const cw = canvas.clientWidth, ch = canvas.clientHeight;
  if (canvas.width !== cw * dpr || canvas.height !== ch * dpr) {
    canvas.width = cw * dpr; canvas.height = ch * dpr;
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, cw, ch);

  // Sweep line
  const sy = (now / 2600 % 1) * ch;
  const g = ctx.createLinearGradient(0, sy - 60, 0, sy);
  g.addColorStop(0, "rgba(61,255,154,0)"); g.addColorStop(1, "rgba(61,255,154,.22)");
  ctx.fillStyle = g; ctx.fillRect(0, sy - 60, cw, 60);

  // Map video pixels to the cover-fitted element
  const vw = video.videoWidth, vh = video.videoHeight;
  if (!vw) return;
  const s = Math.max(cw / vw, ch / vh);
  const ox = (cw - vw * s) / 2, oy = (ch - vh * s) / 2;
  const mirror = video.classList.contains("mirror");
  const on = Math.floor(now / 350) % 2 === 0;

  for (const t of tracks) {
    const pad = 0.18;
    const w = t.w * s * (1 + pad * 2), h = t.h * s * (1 + pad * 2);
    let x = ox + t.cx * s - w / 2;
    const y = oy + t.cy * s - h / 2;
    if (mirror) x = cw - x - w;

    const col = on ? "#ffd23d" : "#3dff9a";
    ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.shadowColor = col; ctx.shadowBlur = 12;
    const c = Math.min(w, h) * 0.22;
    ctx.beginPath();
    ctx.moveTo(x, y + c); ctx.lineTo(x, y); ctx.lineTo(x + c, y);
    ctx.moveTo(x + w - c, y); ctx.lineTo(x + w, y); ctx.lineTo(x + w, y + c);
    ctx.moveTo(x + w, y + h - c); ctx.lineTo(x + w, y + h); ctx.lineTo(x + w - c, y + h);
    ctx.moveTo(x + c, y + h); ctx.lineTo(x, y + h); ctx.lineTo(x, y + h - c);
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 0.35; ctx.lineWidth = 1; ctx.strokeRect(x, y, w, h); ctx.globalAlpha = 1;

    // Blinking label above the box (below it when there is no room)
    let fs = Math.max(16, Math.min(34, w * 0.16));
    ctx.font = `700 ${fs}px ui-monospace, Menlo, Consolas, monospace`;
    let tw = ctx.measureText(t.label).width;
    const maxW = cw - 24;
    if (tw + 20 > maxW) { fs *= maxW / (tw + 20); ctx.font = `700 ${fs}px ui-monospace, Menlo, Consolas, monospace`; tw = ctx.measureText(t.label).width; }
    const bw = tw + 20, bh = fs + 14;
    let bx = Math.max(12, Math.min(cw - bw - 12, x + w / 2 - bw / 2));
    let by = y - bh - 10; if (by < 70) by = y + h + 10;
    ctx.fillStyle = on ? "#ffd23d" : "rgba(4,17,12,.8)";
    ctx.fillRect(bx, by, bw, bh);
    ctx.strokeStyle = "#ffd23d"; ctx.lineWidth = 2; ctx.strokeRect(bx, by, bw, bh);
    ctx.fillStyle = on ? "#04110c" : "#ffd23d";
    ctx.textBaseline = "middle"; ctx.textAlign = "left";
    ctx.fillText(t.label, bx + 10, by + bh / 2 + 1);

    ctx.font = "11px ui-monospace, Menlo, Consolas, monospace";
    ctx.fillStyle = "#3dff9a";
    ctx.fillText(`CÍL #${String(t.id).padStart(2, "0")}`, x, y + h + (by > y ? 34 + bh : 16));
  }
}

let lastTs = -1;
function loop() {
  if (!running) return;
  const now = performance.now();
  if (detector && video.readyState >= 2 && video.currentTime !== lastTs) {
    lastTs = video.currentTime;
    try {
      const res = detector.detectForVideo(video, now);
      const boxes = res.detections.map(d => {
        const b = d.boundingBox;
        return { cx: b.originX + b.width / 2, cy: b.originY + b.height / 2, w: b.width, h: b.height };
      });
      updateTracks(boxes, now);
      $("count").textContent = tracks.length;
    } catch (e) { console.error(e); }
  }
  draw(now);
  requestAnimationFrame(loop);
}

$("start").addEventListener("click", async () => {
  const btn = $("start");
  btn.disabled = true;
  try {
    customText = customInput.value.trim().toUpperCase();
    try { localStorage.setItem("radarText", customInput.value.trim()); } catch {}
    $("shuffle").hidden = !!customText;
    if (!navigator.mediaDevices?.getUserMedia) throw new Error("insecure");
    msg.textContent = "Spouští se kamera…";
    await openCamera();
    msg.textContent = "Načítá se detekce obličejů…";
    await loadDetector();
    $("intro").hidden = true; $("stage").hidden = false;
    running = true; loop();
    navigator.wakeLock?.request("screen").catch(() => {});
  } catch (e) {
    console.error(e);
    msg.textContent =
      e.message === "insecure" ? "Kamera je dostupná jen na stránce načtené přes HTTPS."
      : e.name === "NotAllowedError" ? "Přístup ke kameře nebyl povolen. Povolte ho v nastavení prohlížeče a zkuste to znovu."
      : e.name === "NotFoundError" ? "V zařízení nebyla nalezena kamera."
      : "Detekci obličejů se nepodařilo spustit. Zkuste to znovu.";
    btn.disabled = false;
  }
});

$("flip").addEventListener("click", async () => {
  facing = facing === "user" ? "environment" : "user";
  try { await openCamera(); } catch (e) { console.error(e); facing = facing === "user" ? "environment" : "user"; }
});

$("shuffle").addEventListener("click", () => {
  for (const t of tracks) t.label = "";
  for (const t of tracks) t.label = pickLabel();
});
</script>
</body>
</html>
